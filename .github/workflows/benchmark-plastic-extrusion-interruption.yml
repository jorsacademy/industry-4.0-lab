name: benchmark-plastic-extrusion-interruption

on:
  workflow_dispatch:
  push:
    branches: [main, plastic-extrusion-integration]
    paths:
      - "process-monitoring/plastic-extrusion-interruption-early-warning/config.yaml"
      - "process-monitoring/plastic-extrusion-interruption-early-warning/requirements.txt"
      - "process-monitoring/plastic-extrusion-interruption-early-warning/src/**"
      - "process-monitoring/plastic-extrusion-interruption-early-warning/scripts/**"
      - "process-monitoring/plastic-extrusion-interruption-early-warning/tests/**"
      - ".github/workflows/benchmark-plastic-extrusion-interruption.yml"

permissions:
  contents: write

concurrency:
  group: plastic-extrusion-interruption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: process-monitoring/plastic-extrusion-interruption-early-warning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: process-monitoring/plastic-extrusion-interruption-early-warning/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Download public source
        run: python scripts/download_data.py

      - name: Validate source and interruption proxy
        run: python scripts/validate_data.py

      - name: Run chronological early-warning benchmark
        run: python -m src.train --config config.yaml

      - name: Commit aggregate benchmark reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/source_summary.json \
                  reports/model_selection.csv \
                  reports/metrics.json \
                  reports/drift_diagnostics.csv \
                  reports/feature_importance.csv
          if git diff --cached --quiet; then
            echo "No benchmark report changes."
            exit 0
          fi
          git commit -m "Add verified plastic extrusion interruption benchmark"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
