name: benchmark-multimodal-condition-monitoring

on:
  push:
    branches: [main]
    paths:
      - "predictive-maintenance/multimodal-motor-condition-monitoring/config.yaml"
      - "predictive-maintenance/multimodal-motor-condition-monitoring/requirements.txt"
      - "predictive-maintenance/multimodal-motor-condition-monitoring/src/**"
      - "predictive-maintenance/multimodal-motor-condition-monitoring/scripts/**"
      - ".github/workflows/benchmark-multimodal-condition-monitoring.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-multimodal-condition-monitoring
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-maintenance/multimodal-motor-condition-monitoring
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: predictive-maintenance/multimodal-motor-condition-monitoring/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download measured AI4I 2021 source data
        run: python scripts/download_data.py
      - name: Validate frequency-feature structure
        run: python scripts/validate_data.py
      - name: Run purged blocked modality benchmark
        run: python -m src.train --config config.yaml
      - name: Upload fitted model
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-condition-monitoring-model
          path: predictive-maintenance/multimodal-motor-condition-monitoring/artifacts/
      - name: Commit derived benchmark reports
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f predictive-maintenance/multimodal-motor-condition-monitoring/reports/model_modality_comparison.csv
          git add -f predictive-maintenance/multimodal-motor-condition-monitoring/reports/blocked_oof_predictions.csv
          git add -f predictive-maintenance/multimodal-motor-condition-monitoring/reports/confusion_matrix.csv
          git add -f predictive-maintenance/multimodal-motor-condition-monitoring/reports/class_report.csv
          git add -f predictive-maintenance/multimodal-motor-condition-monitoring/reports/metrics.json
          if git diff --cached --quiet; then
            echo "Benchmark reports unchanged."
          else
            git commit -m "Add multimodal condition-monitoring benchmark results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
