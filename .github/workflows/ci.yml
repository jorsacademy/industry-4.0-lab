name: industry-4.0-lab-ci

on:
  push:
    branches: [main]
    paths:
      - "predictive-maintenance/cnc-tool-wear/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "predictive-maintenance/cnc-tool-wear/**"

permissions:
  contents: read

jobs:
  cnc-tool-wear:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-maintenance/cnc-tool-wear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: predictive-maintenance/cnc-tool-wear/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate raw data when present
        shell: bash
        run: |
          if [ -f data/raw/experiment_18.csv ]; then
            python scripts/validate_data.py
          else
            echo "Raw dataset hydration is still pending."
          fi
