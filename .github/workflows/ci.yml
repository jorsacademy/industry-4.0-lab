name: industry-4.0-lab-ci

on:
  push:
    branches: [main]
    paths:
      - "predictive-maintenance/cnc-tool-wear/**"
      - "predictive-maintenance/multimodal-motor-condition-monitoring/**"
      - "quality-monitoring/electrical-test-report/**"
      - "quality-monitoring/bosch-production-line/**"
      - "quality-monitoring/secom-semiconductor-yield/**"
      - "process-optimization/cnc-turning-quality-force/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "predictive-maintenance/cnc-tool-wear/**"
      - "predictive-maintenance/multimodal-motor-condition-monitoring/**"
      - "quality-monitoring/electrical-test-report/**"
      - "quality-monitoring/bosch-production-line/**"
      - "quality-monitoring/secom-semiconductor-yield/**"
      - "process-optimization/cnc-turning-quality-force/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  cnc-tool-wear:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-maintenance/cnc-tool-wear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: predictive-maintenance/cnc-tool-wear/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate raw data when present
        shell: bash
        run: |
          if [ -f data/raw/experiment_18.csv ]; then
            python scripts/validate_data.py
          else
            echo "Raw CNC dataset is not present in this checkout."
          fi

  multimodal-motor-condition-monitoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-maintenance/multimodal-motor-condition-monitoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: predictive-maintenance/multimodal-motor-condition-monitoring/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate source data when present
        shell: bash
        run: |
          if find data/raw -type f ! -name '.gitkeep' | grep -q .; then
            python scripts/validate_data.py
          else
            echo "AI4I 2021 source data is downloaded transiently by the benchmark workflow."
          fi

  electrical-test-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-monitoring/electrical-test-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/electrical-test-report/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate raw data when present
        shell: bash
        run: |
          if [ -f data/raw/Electrical_Test_Report.csv ]; then
            python scripts/validate_data.py
          else
            echo "Raw electrical-test dataset is source-downloaded and intentionally untracked."
          fi

  bosch-production-line:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-monitoring/bosch-production-line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/bosch-production-line/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate competition data when locally available
        shell: bash
        run: |
          if [ -f data/raw/train_numeric.csv ] && [ -f data/raw/train_date.csv ]; then
            python scripts/validate_data.py
          else
            echo "Bosch competition data is intentionally not redistributed; unit tests use synthetic fixtures."
          fi

  secom-semiconductor-yield:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-monitoring/secom-semiconductor-yield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/secom-semiconductor-yield/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate source data when present
        shell: bash
        run: |
          if [ -f data/raw/secom.data ] && [ -f data/raw/secom_labels.data ]; then
            python scripts/validate_data.py
          else
            echo "SECOM data is downloaded from the canonical UCI source by the benchmark workflow."
          fi

  cnc-turning-quality-force:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: process-optimization/cnc-turning-quality-force
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: process-optimization/cnc-turning-quality-force/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate source data when present
        shell: bash
        run: |
          if [ -f data/raw/Exp1.csv ] && [ -f data/raw/Exp2.csv ]; then
            python scripts/validate_data.py
          else
            echo "CNC turning source data is downloaded transiently by the benchmark workflow."
          fi
