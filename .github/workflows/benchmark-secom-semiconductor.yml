name: benchmark-secom-semiconductor-yield

on:
  push:
    branches: [main]
    paths:
      - "quality-monitoring/secom-semiconductor-yield/config.yaml"
      - "quality-monitoring/secom-semiconductor-yield/requirements.txt"
      - "quality-monitoring/secom-semiconductor-yield/src/**"
      - "quality-monitoring/secom-semiconductor-yield/scripts/**"
      - ".github/workflows/benchmark-secom-semiconductor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-monitoring/secom-semiconductor-yield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/secom-semiconductor-yield/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download canonical UCI SECOM data
        run: python scripts/download_data.py
      - name: Validate source data
        run: python scripts/validate_data.py
      - name: Run chronological sensor-panel benchmark
        run: python -m src.train --config config.yaml
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: secom-yield-model
          path: quality-monitoring/secom-semiconductor-yield/artifacts/
      - name: Commit benchmark reports
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f quality-monitoring/secom-semiconductor-yield/reports/panel_model_comparison.csv
          git add -f quality-monitoring/secom-semiconductor-yield/reports/metrics.json
          git add -f quality-monitoring/secom-semiconductor-yield/reports/selected_process_variables.csv
          git add -f quality-monitoring/secom-semiconductor-yield/reports/drift_report.csv
          git add -f quality-monitoring/secom-semiconductor-yield/reports/test_predictions.csv
          if git diff --cached --quiet; then
            echo "Benchmark reports unchanged."
          else
            git commit -m "Add SECOM semiconductor yield benchmark results"
            git push
          fi
