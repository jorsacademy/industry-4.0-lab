name: benchmark-multistage-continuous-flow-quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "process-monitoring/multistage-continuous-flow-quality-forecast/config.yaml"
      - "process-monitoring/multistage-continuous-flow-quality-forecast/requirements.txt"
      - "process-monitoring/multistage-continuous-flow-quality-forecast/src/**"
      - "process-monitoring/multistage-continuous-flow-quality-forecast/scripts/**"
      - "process-monitoring/multistage-continuous-flow-quality-forecast/tests/**"
      - ".github/workflows/benchmark-multistage-continuous-flow-quality.yml"

permissions:
  contents: write

concurrency:
  group: multistage-continuous-flow-quality-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: process-monitoring/multistage-continuous-flow-quality-forecast
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: process-monitoring/multistage-continuous-flow-quality-forecast/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Download public Kaggle source
        run: python scripts/download_data.py

      - name: Validate source structure
        run: python scripts/validate_data.py

      - name: Run chronological forecasting benchmark
        run: python -m src.train --config config.yaml

      - name: Upload fitted model and reports
        uses: actions/upload-artifact@v4
        with:
          name: multistage-continuous-flow-quality-benchmark
          path: |
            process-monitoring/multistage-continuous-flow-quality-forecast/artifacts/continuous_flow_quality_model.joblib
            process-monitoring/multistage-continuous-flow-quality-forecast/reports/*.csv
            process-monitoring/multistage-continuous-flow-quality-forecast/reports/*.json
          if-no-files-found: error

      - name: Commit aggregate benchmark reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/model_selection.csv \
                  reports/metrics.json \
                  reports/per_target_metrics.csv \
                  reports/interval_coverage.csv \
                  reports/drift_diagnostics.csv \
                  reports/feature_importance.csv
          if git diff --cached --quiet; then
            echo "No benchmark report changes."
            exit 0
          fi
          git commit -m "Add verified continuous-flow quality benchmark"
          git pull --rebase origin main
          git push origin HEAD:main
