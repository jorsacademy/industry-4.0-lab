name: manufacturing-process-prototypes

on:
  push:
    branches: [main]
    paths:
      - "process-optimization/welding-process-parameter-optimization/**"
      - "process-optimization/sheet-metal-stamping-process-optimization/**"
      - "process-optimization/laser-cutting-process-optimization/**"
      - "process-optimization/heat-treatment-profile-optimization/**"
      - "process-optimization/grinding-process-adaptive-control/**"
      - "process-optimization/machining-coolant-flow-optimization/**"
      - "quality-monitoring/casting-quality-multimodal-prediction/**"
      - ".github/workflows/manufacturing-process-prototypes.yml"
  pull_request:
    paths:
      - "process-optimization/welding-process-parameter-optimization/**"
      - "process-optimization/sheet-metal-stamping-process-optimization/**"
      - "process-optimization/laser-cutting-process-optimization/**"
      - "process-optimization/heat-treatment-profile-optimization/**"
      - "process-optimization/grinding-process-adaptive-control/**"
      - "process-optimization/machining-coolant-flow-optimization/**"
      - "quality-monitoring/casting-quality-multimodal-prediction/**"
      - ".github/workflows/manufacturing-process-prototypes.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - process-optimization/welding-process-parameter-optimization
          - process-optimization/sheet-metal-stamping-process-optimization
          - process-optimization/laser-cutting-process-optimization
          - process-optimization/heat-treatment-profile-optimization
          - process-optimization/grinding-process-adaptive-control
          - process-optimization/machining-coolant-flow-optimization
          - quality-monitoring/casting-quality-multimodal-prediction
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
