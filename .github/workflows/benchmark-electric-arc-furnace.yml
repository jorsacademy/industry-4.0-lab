name: benchmark-electric-arc-furnace-soft-sensor

on:
  push:
    branches: [main]
    paths:
      - "process-monitoring/electric-arc-furnace-soft-sensor/config.yaml"
      - "process-monitoring/electric-arc-furnace-soft-sensor/requirements.txt"
      - "process-monitoring/electric-arc-furnace-soft-sensor/src/**"
      - "process-monitoring/electric-arc-furnace-soft-sensor/scripts/**"
      - ".github/workflows/benchmark-electric-arc-furnace.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: process-monitoring/electric-arc-furnace-soft-sensor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: process-monitoring/electric-arc-furnace-soft-sensor/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download public EAF source data
        run: python scripts/download_data.py
      - name: Validate heat/event structure
        run: python scripts/validate_data.py
      - name: Run chronological soft-sensor benchmark
        run: python -m src.train --config config.yaml
      - name: Upload fitted model
        uses: actions/upload-artifact@v4
        with:
          name: eaf-temperature-soft-sensor
          path: process-monitoring/electric-arc-furnace-soft-sensor/artifacts/
      - name: Commit derived benchmark reports
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f process-monitoring/electric-arc-furnace-soft-sensor/reports/model_selection.csv
          git add -f process-monitoring/electric-arc-furnace-soft-sensor/reports/metrics.json
          git add -f process-monitoring/electric-arc-furnace-soft-sensor/reports/test_predictions.csv
          git add -f process-monitoring/electric-arc-furnace-soft-sensor/reports/feature_importance.csv
          git add -f process-monitoring/electric-arc-furnace-soft-sensor/reports/snapshot_summary.csv
          if git diff --cached --quiet; then
            echo "Benchmark reports unchanged."
          else
            git commit -m "Add EAF soft-sensor benchmark results"
            git push
          fi
