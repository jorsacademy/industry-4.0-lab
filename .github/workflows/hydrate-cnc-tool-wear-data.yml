name: hydrate-cnc-tool-wear-data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hydrate-cnc-tool-wear-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download public-domain CNC telemetry dataset
        run: |
          python -m pip install --upgrade "kagglehub>=1.0.2"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import kagglehub

          project = Path("predictive-maintenance/cnc-tool-wear")
          destination = project / "data" / "raw"
          destination.mkdir(parents=True, exist_ok=True)

          cache = Path(kagglehub.dataset_download(
              "shasun/tool-wear-detection-in-cnc-mill",
              force_download=True,
          ))

          expected = ["train.csv", "test_artifact.jpg"] + [f"experiment_{i:02d}.csv" for i in range(1, 19)]
          located = {}
          for name in expected:
              matches = list(cache.rglob(name))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected exactly one {name}; found {len(matches)}")
              source = matches[0]
              target = destination / name
              shutil.copy2(source, target)
              located[name] = target

          manifest = {"files": {}}
          for name, path in sorted(located.items()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest["files"][name] = {"sha256": digest, "bytes": path.stat().st_size}
          (destination / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate dataset layout
        working-directory: predictive-maintenance/cnc-tool-wear
        run: |
          python -m pip install pandas numpy pyyaml
          python scripts/validate_data.py

      - name: Commit hydrated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictive-maintenance/cnc-tool-wear/data/raw
          git commit -m "Add CNC tool wear telemetry dataset"
          git push
