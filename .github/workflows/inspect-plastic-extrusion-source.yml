name: inspect-plastic-extrusion-source

on:
  push:
    branches: [plastic-extrusion-integration]
    paths:
      - "quality-monitoring/plastic-extrusion-break-early-warning/**"
      - ".github/workflows/inspect-plastic-extrusion-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quality-monitoring/plastic-extrusion-break-early-warning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/plastic-extrusion-break-early-warning/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/validate_data.py
      - run: python scripts/inspect_target.py
      - run: python scripts/inspect_activity_proxy.py
