name: inspect-plastic-extrusion-source

on:
  push:
    branches: [plastic-extrusion-integration]
    paths:
      - "quality-monitoring/plastic-extrusion-break-early-warning/**"
      - ".github/workflows/inspect-plastic-extrusion-source.yml"

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quality-monitoring/plastic-extrusion-break-early-warning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/plastic-extrusion-break-early-warning/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/validate_data.py
      - run: python scripts/inspect_target.py
      - run: python scripts/inspect_activity_proxy.py
      - name: Commit aggregate activity diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/activity_proxy_summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add extrusion activity-proxy diagnostic"
          git pull --rebase origin plastic-extrusion-integration
          git push origin HEAD:plastic-extrusion-integration
