name: verify-electrical-test-data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "quality-monitoring/electrical-test-report/scripts/download_data.py"
      - "quality-monitoring/electrical-test-report/scripts/validate_data.py"
      - "quality-monitoring/electrical-test-report/src/data.py"
      - "quality-monitoring/electrical-test-report/config.yaml"
      - ".github/workflows/verify-electrical-test-data.yml"

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-monitoring/electrical-test-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-monitoring/electrical-test-report/requirements.txt
      - run: pip install -r requirements.txt
      - name: Download source dataset from Kaggle
        run: python scripts/download_data.py
      - name: Validate source structure and published integrity counts
        run: python scripts/validate_data.py
