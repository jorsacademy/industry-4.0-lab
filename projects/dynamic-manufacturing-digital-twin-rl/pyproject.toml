[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-manufacturing-digital-twin-rl"
version = "0.9.0"
description = "A research-grade dynamic manufacturing digital twin for reinforcement-learning scheduling and OR benchmarking."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "JORS Academy"}]
dependencies = [
  "numpy>=1.26,<3",
  "gymnasium>=0.29,<2",
]

[project.optional-dependencies]
rl = [
  "stable-baselines3>=2.3,<3",
]
or = [
  "ortools>=9.10,<10",
]
analysis = [
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
dmdtrl-baselines = "dmdtrl.evaluate:main"
dmdtrl-train = "dmdtrl.train:main"
dmdtrl-research = "dmdtrl.research:main"
dmdtrl-stress = "dmdtrl.stress:main"
dmdtrl-or = "dmdtrl.or_benchmark:main"
dmdtrl-or-sensitivity = "dmdtrl.or_sensitivity:main"
dmdtrl-or-select = "dmdtrl.or_selection:main"
dmdtrl-ppo-campaign = "dmdtrl.ppo_campaign:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
