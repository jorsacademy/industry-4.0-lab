name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MDP self-test
        run: python industrial_maintenance_mdp.py --self-test

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end stochastic cross-check
        run: |
          python industrial_maintenance_mdp.py \
            --monte-carlo-trajectories 3000 \
            --monte-carlo-horizon 220 \
            --seed 42
